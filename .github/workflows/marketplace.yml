name: Plugin Marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Validate marketplace and plugins
        run: |
          python3 scripts/validate_marketplace.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s plugins/photo-art-studio/skills/create-photo-art/tests -p 'test_*.py'

      - name: Install website dependencies
        working-directory: plugin-marketplace-site
        run: bun install --frozen-lockfile

      - name: Test and export website
        working-directory: plugin-marketplace-site
        run: |
          bun run lint
          bun run test
          bun run build:pages

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: plugin-marketplace-site
        run: bunx wrangler pages deploy out --project-name shufflgl-codex-plugins --branch main

      - name: Deploy pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: plugin-marketplace-site
        run: bunx wrangler pages deploy out --project-name shufflgl-codex-plugins --branch "pr-${{ github.event.number }}"
